# ============================================================
#  GEC6818 智能车载中控 配置文件
#  以 # 或 ; 开头是注释，格式 key=value
# ============================================================

# 0 白天主题，1 夜间主题
night=0

# 音量 0~30（界面显示用；madplay 实际音量由 -a 参数控制）
volume=12

# 车内温度 16~30（状态栏显示）
temperature=24

# 1 进入仪表盘时自动演示车速指针，0 关闭
demo=1

# 音乐页音频开关：
#   1 = 默认，调用 madplay 播放 res/music/ 下的 2~3 秒短音频
#       （板子没有 madplay 时会自动只走界面，不出声）
#   0 = 纯模拟，不调用 madplay，不需要 mp3
audio=1

# 页面切换动画：
#   1 = 滑动转场（有动画，但个别屏可能看到拖影）
#   0 = 直接切换（默认，最稳，不闪屏）
page_anim=0

# 字库
font=res/font/simfang.ttf

# 开机 Logo（建议 400x200）
logo=res/car/logo.bmp

# 主页背景（800x480）
bg_day=res/car/bg_day.bmp
bg_night=res/car/bg_night.bmp

# 主页五个图标（建议 96x96）
icon_nav=res/car/icon_nav.bmp
icon_dash=res/car/icon_dash.bmp
icon_music=res/car/icon_music.bmp
icon_phone=res/car/icon_phone.bmp
icon_setting=res/car/icon_setting.bmp
icon_pic=res/car/icon_pic.bmp

# 昼夜切换小图标（建议 24x24，可缺省）
icon_sun=res/car/icon_sun.bmp
icon_moon=res/car/icon_moon.bmp

# 仪表盘背景（800x480，可缺省，缺省时用渐变）
dash_bg=res/car/dash_bg.bmp

# 音乐页专辑封面（建议 300x300）
album=res/car/album.bmp

# 相册目录（photo_N.bmp 全图，thumb_N.bmp 缩略图）
photo_dir=res/photo

# 倒车影像占位图（800x480）
reverse=res/car/reverse.bmp

# 歌曲：标题|歌手|文件路径|时长(秒)
# 没有 mp3 也能运行，进度条会模拟走秒
song=夜空中最亮的星|逃跑计划|res/music/1.mp3|1
song=平凡之路|朴树|res/music/2.mp3|2
song=海阔天空|Beyond|res/music/3.mp3|4
